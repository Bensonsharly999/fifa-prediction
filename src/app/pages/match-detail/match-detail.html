<div class="match-bg" *ngIf="match() as m">

  <!-- ✅ Back Button -->
  <img 
    src="assets/boot_back.png"
    class="back-img"
    (click)="goToBack()"
  />

  <!-- ✅ Teams Section -->
  <div class="teams">

    <!-- ✅ Trophy -->
    <img 
      src="assets/trophy2.png" 
      class="trophy"
    />

    <!-- ================= TEAM A ================= -->
    <div 
      class="team"
      [class.active]="selectedTeam === 'A'"
    >

      <div class="flag-card">

        <!-- Player Image -->
        <img 
          [src]="m.playerA" 
          class="legend-img"
        />

        <!-- Flag -->
        <img 
          [src]="m.teamAFlag" 
          class="flag"
        />

      </div>

      <h3>{{ m.teamA }}</h3>

      <input
        type="number"
        [(ngModel)]="scoreA"
        class="score-box"
        min="0"
        max="20"
        [readonly]="goal"

        (input)="!goal && onMouseChange()"
       
      />

    </div>
    <!-- ================= END TEAM A ================= -->


    <!-- ================= TEAM B ================= -->
    <div 
      class="team"
      [class.active]="selectedTeam === 'B'"
    >

      <div class="flag-card">

        <!-- Player Image -->
        <img 
          [src]="m.playerB" 
          class="legend-img"
        />

        <!-- Flag -->
        <img 
          [src]="m.teamBFlag" 
          class="flag"
        />

      </div>

      <h3>{{ m.teamB }}</h3>

      <input
        type="number"
        [(ngModel)]="scoreB"
        class="score-box"
        min="0"
        max="20"
        [readonly]="goal"

        (input)="!goal && onMouseChange()"
        
      />
<!-- (keydown)="disableTyping($event)" -->
    </div>
    <!-- ================= END TEAM B ================= -->

  </div>

  <!-- ✅ Message -->
  <p class="msg">{{ message }}</p>

  <!-- ✅ Goal Toast -->
  <div class="goal-toast" *ngIf="showGoalToast">

    <img src="assets/ref1.png" class="referee-img" />

    <div class="comment-box">
      <h4>⚽ GOOOAL!!!</h4>
      <p>{{ goalComment }}</p>
    </div>

  </div>

  <!-- ✅ Final Result -->
  <div class="goal-toast" *ngIf="goal">

    <img src="assets/ref2.png" class="referee-img" />

    <div class="comment-box">
      <p>{{ goalComment }}</p>
    </div>

  </div>
  
<div class="submit-ball" *ngIf="!goal" (click)="selectWinner()">
  <img src="assets/fot_submit.png" alt="submit"  />
</div>


</div>
