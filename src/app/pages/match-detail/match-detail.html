<div class="match-bg" *ngIf="match() as m">

  <!-- Back Button -->
  <img 
    src="assets/boot_back.png"
    class="back-img"
    (click)="goToBack()"
  />

  <!-- ============================= -->
  <!-- Teams Section -->
  <!-- ============================= -->
  <div class="teams">

    <!-- Trophy -->
    <img src="assets/trophy2.png" class="trophy">

    <!-- ================= TEAM A ================= -->
    <div class="team"
         [class.active]="selectedTeam === 'A'">

      <!-- Player Image + Flag -->
      <div class="flag-card">

        <!-- Player / Legend Image -->
        <img 
          [src]="m.playerA" 
          class="legend-img"
        >

        <!-- Team Flag -->
        <img 
          [src]="m.teamAFlag" 
          class="flag"
          (click)="selectWinner()"
        >

      </div>

      <!-- Team Name -->
      <h3>{{ m.teamA }}</h3>

      <!-- Score Input -->
      <input 
        type="number"
        [(ngModel)]="scoreA"
        class="score-box"
        min="0"
        max="20"
        [readonly]="goal"

        (mouseup)="!goal && onMouseChange()"
        (keydown)="disableTyping($event)"
      >

    </div>
    <!-- ================= END TEAM A ================= -->


    <!-- VS Separator -->
    <div class="vs">VS</div>


    <!-- ================= TEAM B ================= -->
    <div class="team"
         [class.active]="selectedTeam === 'B'">

      <!-- Player Image + Flag -->
      <div class="flag-card">

        <!-- Player / Legend Image -->
        <img 
          [src]="m.playerB" 
          class="legend-img"
        >

        <!-- Team Flag -->
        <img 
          [src]="m.teamBFlag" 
          class="flag"
          (click)="!goal && selectWinner()"
        >

      </div>

      <!-- Team Name -->
      <h3>{{ m.teamB }}</h3>

      <!-- Score Input -->
      <input 
        type="number"
        [(ngModel)]="scoreB"
        class="score-box"
        min="0"
        max="20"
        [readonly]="goal"

        (mouseup)="!goal && onMouseChange()"
        (keydown)="disableTyping($event)"
      >

    </div>
    <!-- ================= END TEAM B ================= -->

  </div>

  <!-- ============================= -->
  <!-- Message Section -->
  <!-- ============================= -->
  <p class="msg">{{ message }}</p>


  <!-- ============================= -->
  <!-- Goal Celebration Toast -->
  <!-- ============================= -->
  <div class="goal-toast" *ngIf="showGoalToast">

    <!-- Referee Image -->
    <img src="assets/ref1.png" class="referee-img">

    <!-- Goal Message -->
    <div class="comment-box">
      <h4>⚽ GOOOAL!!!</h4>
      <p>{{ goalComment }}</p>
    </div>

  </div>


  <!-- ============================= -->
  <!-- Final Goal / Result Message -->
  <!-- ============================= -->
  <div class="goal-toast" *ngIf="goal">

    <!-- Referee Image -->
    <img src="assets/ref2.png" class="referee-img">

    <!-- Result Message -->
    <div class="comment-box">
      <p>{{ goalComment }}</p>
    </div>

  </div>

</div>
